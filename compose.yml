
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/portfolio/site:/srv/portfolio:ro
      - /opt/portfolio/mojabiblioteka:/srv/mojabiblioteka:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - vouchers-frontend
      - vouchers-nginx
    networks:
      - web

  vouchers-frontend:
    image: ${VOUCHERS_FRONTEND_IMAGE}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - web

  # Copy Laravel public files from the published PHP image
  # into a volume that Nginx can access.
  vouchers-public-init:
    image: ${VOUCHERS_API_IMAGE}
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        find /shared -mindepth 1 -maxdepth 1 -exec rm -rf {} \;
        cp -a /var/www/public/. /shared/
    volumes:
      - vouchers_public:/shared

  vouchers-nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      vouchers-public-init:
        condition: service_completed_successfully
      vouchers-api:
        condition: service_started
    volumes:
      - ./vouchers-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - vouchers_public:/var/www/public:ro
    expose:
      - "80"
    networks:
      - web
      - backend

  vouchers-api:
    image: ${VOUCHERS_API_IMAGE}
    restart: unless-stopped
    env_file:
      - ./vouchers-api.env
    depends_on:
      vouchers-db:
        condition: service_healthy
    expose:
      - "9000"
    networks:
      - backend

  vouchers-db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: vouchers
      MYSQL_USER: vouchers
      MYSQL_PASSWORD: ${VOUCHERS_DB_PASSWORD:?Set VOUCHERS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${VOUCHERS_DB_ROOT_PASSWORD:?Set VOUCHERS_DB_ROOT_PASSWORD}
    volumes:
      - vouchers_db:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - backend

networks:
  web:
  backend:
    internal: true

volumes:
  caddy_data:
    external: true
    name: portfolio_caddy_data

  caddy_config:
    external: true
    name: portfolio_caddy_config

  vouchers_public:
  vouchers_db:
